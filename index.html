    margin: 0;
    padding: 0;
    background: #0f0f0f;

    height: 100%;
  }

    height: 100vh;
  }

    width: 100%;
    height: 100%;

    background-position: 38% center;
    filter: grayscale(100%) brightness(0.65) contrast(1.1);
    pointer-events: none;
  }
  .sb-hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(15,15,15,0.15) 0%, rgba(15,15,15,0.45) 60%, rgba(15,15,15,0.72) 100%);

    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 2rem;
    filter: none;
    margin-top: -8vh;
    pointer-events: none;
  }
  .sb-hero__link, .sb-hero__nav-primary, .sb-hero__nav-secondary {
    pointer-events: all;
  }
  .sb-hero__title {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    font-size: clamp(1.4rem, 4vw, 3.5rem);
    font-weight: 300;
    letter-spacing: 0.35em;
    color: #ede3bf;
    margin: 0 0 3.3rem 0;
    line-height: 1;
    text-transform: uppercase;
    text-shadow: 0 2px 32px rgba(0,0,0,0.4);
  }
  /* Primary nav line: ACTIONS */
  .sb-hero__nav-primary {

    align-items: center;
    justify-content: center;
    margin-bottom: 1.65rem;
  }
  /* Secondary nav line: MISSION — TOOLKIT — CALL US */
  .sb-hero__nav-secondary {

    justify-content: center;
    flex-wrap: wrap;
  }

    border-bottom-color: #7a9bb5;
  }
  .sb-hero__link--secondary {
    font-size: clamp(0.72rem, 1.4vw, 0.95rem);

  }
  .sb-hero__link--secondary:hover {
    color: #f5eedc;
    border-bottom-color: #7a9bb5;
  }
  .sb-hero__divider {
    color: #7a9bb5;
    font-size: 0.8rem;

  }

  .sb-emblems {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }
  .sb-emblem {

    transition: opacity 0.3s ease;
    display: block;
    text-decoration: none;
  }
  .sb-emblem:hover { opacity: 0.85; }
  .sb-emblem--left {

  }
  .sb-emblem--right {

  }
  .sb-emblem--right img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    display: block;
  }


  /* Floral emblem nav link */
  .sb-floral-nav {

  }

    height: clamp(14px, 1.3vw, 18px);
    opacity: 0;

    border-radius: 4px;
    transform-origin: center;

  @keyframes bloom {

  }
  @media (max-width: 480px) {
    .sb-hero__divider { display: none; }

(function() {
  function positionFloralNav() {
    var toolkitEl = document.querySelector('.sb-hero__link[href*="toolkit"]');
    var floralNav = document.querySelector('.sb-floral-nav');
    if (!toolkitEl || !floralNav) return;
    var textNode = toolkitEl.firstChild;
    var text = textNode ? textNode.textContent : '';
    var ooStart = text.search(/oo/i);
    var centerX;
    if (ooStart >= 0) {
      var range = document.createRange();
      range.setStart(textNode, ooStart);
      range.setEnd(textNode, ooStart + 2);
      var ooRect = range.getBoundingClientRect();
      centerX = ooRect.left + ooRect.width / 2;
    } else {
      var rect = toolkitEl.getBoundingClientRect();
      centerX = rect.left + rect.width / 2;
    }
    floralNav.style.left = centerX + 'px';
    floralNav.style.transform = 'translate(-50%, -50%)';
  }
  window.addEventListener('load', positionFloralNav);
  window.addEventListener('resize', positionFloralNav);
})();
