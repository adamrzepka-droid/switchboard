    margin: 0;
    padding: 0;
    background: #0f0f0f;
    overflow: hidden;
    height: 100%;
  }
  .top, .footer { display: none !important; }

    width: 100%;
    height: 100%;

    background-size: cover;
    background-position: 38% center;
    filter: grayscale(100%) brightness(0.65) contrast(1.1);
    z-index: 0;
  }
  .sb-hero::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, rgba(15,15,15,0.15) 0%, rgba(15,15,15,0.45) 60%, rgba(15,15,15,0.72) 100%);
    z-index: 1;
  }
  .sb-hero__content {
    position: absolute;
    inset: 0;
    z-index: 2;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 2rem;
    margin-top: -8vh;
    pointer-events: none;
  }
  .sb-hero__link, .sb-hero__nav-primary, .sb-hero__nav-secondary {
    pointer-events: all;
  }
  .sb-hero__title {
    font-family: "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
    font-size: clamp(1.4rem, 4vw, 3.5rem);
    font-weight: 300;
    letter-spacing: 0.35em;
    color: #e2cea8;
    margin: 0 0 3.3rem 0;
    line-height: 1;
    text-transform: uppercase;
    text-shadow: 0 2px 32px rgba(0,0,0,0.4);
  }
  /* Primary nav line: ACTIONS */
  .sb-hero__nav-primary {
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1.65rem;
  }
  /* Secondary nav line: MISSION — TOOLKIT — CALL US */
  .sb-hero__nav-secondary {
    display: flex;
    align-items: center;
    gap: 1.8rem;
    justify-content: center;
    flex-wrap: wrap;
  }
  .sb-hero__link {
    font-family: "Gill Sans", "Gill Sans MT", Calibri, "Trebuchet MS", sans-serif;
    font-weight: 400;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    text-decoration: none;
    transition: color 0.3s ease;
    padding-bottom: 2px;
    border-bottom: 1px solid transparent;
  }
  .sb-hero__link--primary {
    font-size: clamp(0.95rem, 2vw, 1.3rem);
    color: #e2cea8;
  }
  .sb-hero__link--primary:hover {
    color: #f0e4c0;
    border-bottom-color: #7a9bb5;
  }
  .sb-hero__link--secondary {
    font-size: clamp(0.72rem, 1.4vw, 0.95rem);
    color: #e2cea8;
  }
  .sb-hero__link--secondary:hover {
    color: #f0e4c0;
    border-bottom-color: #7a9bb5;
  }
  .sb-hero__divider {
    color: #7a9bb5;
    font-size: 0.8rem;
    opacity: 0.7;
  }

  /* Emblems */
  .sb-emblems {
    position: absolute;
    inset: 0;
    z-index: 2;
    pointer-events: none;
  }


  /* Floral emblem nav link */
  .sb-floral-nav {
    position: absolute;
    width: clamp(1.4rem, 4vw, 3.5rem);
    height: clamp(1.4rem, 4vw, 3.5rem);
    left: 49%;
    top: 90%;
    transform: translate(-50%, -50%);
    display: block;
    pointer-events: all;
    transition: opacity 0.3s ease;
    z-index: 3;
  }
  .sb-floral-nav:hover { opacity: 0.8; }
  .sb-floral-nav img {
    width: 100%;
    height: 100%;
    display: block;
  }
  /* Kiefer flower animation */
  .sb-flowers {
    position: absolute;
    inset: 0;
    z-index: 3;
    pointer-events: none;
  }
  .sb-flower {
    position: absolute;
    width: clamp(14px, 1.3vw, 18px);
    height: clamp(14px, 1.3vw, 18px);
    opacity: 0;
    animation: bloom 40s ease-in-out infinite;
    border-radius: 4px;
    transform-origin: center;
  }
  @keyframes bloom {
    0%    { opacity: 0;    transform: scale(0.75); }
    2.5%  { opacity: 0.82; transform: scale(1.0);  }
    12.5% { opacity: 0.82; transform: scale(1.0);  }
    15%   { opacity: 0;    transform: scale(0.85); }
    100%  { opacity: 0;    transform: scale(0.75); }
  }
  @media (max-width: 480px) {
    .sb-hero__divider { display: none; }
    .sb-emblems { display: none; }

(function() {
  function positionFloralNav() {
    var toolkitEl = document.querySelector('.sb-hero__link[href*="toolkit"]');
    var floralNav = document.querySelector('.sb-floral-nav');
    if (!toolkitEl || !floralNav) return;
    var rect = toolkitEl.getBoundingClientRect();
    var centerX = rect.left + rect.width / 2;
    floralNav.style.left = centerX + 'px';
    floralNav.style.transform = 'translate(-50%, -50%)';
  }
  window.addEventListener('load', positionFloralNav);
  window.addEventListener('resize', positionFloralNav);
})();
